<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f7f8fa">
  <meta name="description" content="按小班逐人核对准考证，自动记录核对进度。">
  <title>准考证分班核对 · 离线版</title>
  <style>
:root{--bg:#f6f7f9;--paper:#fff;--ink:#202a39;--muted:#85909e;--line:#e7eaf0;--navy:#1f3047;--accent:#16806d;--accent-light:#e3f4ef;--shadow:0 8px 30px rgba(34,48,66,.035)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.5}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #77c8b9;outline-offset:3px}
svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app-shell{max-width:1380px;margin:0 auto;padding:34px 42px 20px}
.app-header{display:flex;align-items:center;justify-content:space-between;gap:25px;margin-bottom:31px}
.brand,.header-actions{display:flex;align-items:center}
.brand{gap:16px}
.brand-mark{width:53px;height:53px;display:grid;place-items:center;border-radius:16px;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(31,48,71,.16)}
.brand-mark svg{width:27px;height:27px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.9px;color:#7c899b;margin:0 0 4px}
h1,h2,h3,p{margin-top:0}
h1{font-size:25px;line-height:1.25;letter-spacing:-.4px;margin-bottom:0;font-weight:760}
.header-actions{gap:10px}
.autosave{font-size:12px;color:#718078;margin-right:8px;white-space:nowrap}
.save-dot{display:inline-block;height:7px;width:7px;border-radius:50%;background:#23a785;margin-right:6px;vertical-align:1px}
.autosave.warning{color:#aa6645}.autosave.warning .save-dot{background:#e2a15e}
.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:10px;font-weight:650;white-space:nowrap;transition:background .16s,color .16s,transform .16s;border:1px solid transparent}
.button svg{width:16px;height:16px}
.button:hover{transform:translateY(-1px)}
.button-outline{background:#fff;color:#3c4a59;border-color:#dfe4eb}
.button-outline:hover{background:#f8fafb}
.button-dark{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 11px rgba(31,48,71,.10)}
.button-dark:hover{background:#2e4663}
.summary{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr));gap:15px;margin-bottom:22px}
.overview-card,.metric-card{background:var(--paper);border:1px solid #eceef2;border-radius:16px;box-shadow:var(--shadow);min-height:167px}
.overview-card{padding:23px 27px}
.overview-topline{display:flex;align-items:baseline;justify-content:space-between}
.overview-label{color:#657286;font-size:13px;font-weight:650}
.overview-percent{font-weight:800;font-size:17px;color:var(--accent)}
.overview-main{display:flex;align-items:baseline;gap:9px;margin:8px 0 15px}
.overview-main strong{font-size:38px;line-height:1.03;font-weight:780;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.overview-denominator{color:#8d97a6;font-size:15px}
.progress-track{height:7px;border-radius:12px;background:#eaf0ee;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#16a386,#56c8ad);width:0%;transition:width .25s ease;border-radius:12px}
.card-footnote{margin:10px 0 0;font-size:11px;color:#9ba4ae}
.metric-card{display:flex;align-items:center;gap:20px;padding:22px 28px}
.metric-icon{width:49px;height:49px;border-radius:14px;flex-shrink:0;display:grid;place-items:center;font-size:26px;font-weight:600}
.pending-icon{background:#fdf2e7;color:#dd9a47}
.done-icon{background:#e6f7ef;color:#259675;font-size:23px}
.metric-label{font-size:13px;color:#778397;font-weight:620}
.metric-value{font-size:36px;line-height:1.25;font-weight:790;letter-spacing:-1px;font-variant-numeric:tabular-nums;margin-top:2px}
.metric-card p{margin:4px 0 0;color:#a0a7b1;font-size:11px;white-space:nowrap}
.workspace{display:grid;grid-template-columns:275px minmax(0,1fr);gap:20px;align-items:start}
.class-panel,.content-panel{background:var(--paper);border:1px solid #e9edf2;box-shadow:var(--shadow);border-radius:16px}
.class-panel{padding:23px 14px 16px;position:sticky;top:18px}
.panel-heading{display:flex;align-items:center;justify-content:space-between;padding:0 12px 18px}
.panel-heading h2{font-size:15px;font-weight:750;margin:0}
.class-count{font-size:11px;color:#9ca5b1;background:#f2f4f7;border-radius:7px;padding:3px 8px}
.class-nav{display:flex;flex-direction:column;gap:4px}
.class-button{width:100%;border:1px solid transparent;text-align:left;border-radius:10px;padding:11px 12px;background:transparent;display:flex;flex-direction:column;gap:8px;color:#617084;transition:background .12s,border-color .12s}
.class-button:hover{background:#f8fafb}
.class-button.active{background:#edf4f2;border-color:#dbebe5;color:#1e6055}
.class-button.active .class-name{color:#174a43}
.class-top{display:flex;align-items:center;justify-content:space-between;width:100%;gap:6px}
.class-name{font-size:13px;font-weight:720;letter-spacing:.4px;color:#4a596c}
.class-progress-text{font-size:11px;color:#97a0ad;font-variant-numeric:tabular-nums}
.class-button.active .class-progress-text{color:#63968c}
.class-mini-track{height:4px;background:#e9edef;overflow:hidden;border-radius:5px;width:100%}
.class-mini-fill{height:100%;background:#41b39a;border-radius:5px}
.class-button.active .class-mini-track{background:#d7e7e1}
.class-button.all{margin-bottom:10px;padding-top:13px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.class-button.all .class-name{letter-spacing:0}
.class-button.all .all-note{font-size:11px;color:#9ba5ad}
.panel-tip{display:flex;gap:10px;color:#9aa4ae;font-size:11px;line-height:1.65;margin:24px 9px 2px;padding:16px 11px 1px;border-top:1px solid var(--line)}
.panel-tip svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;color:#94a59e}
.content-panel{padding:29px 30px 19px;min-height:565px}
.content-heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}
.heading-kicker{color:#9ba4b2;font-size:11px;font-weight:750;letter-spacing:1.3px;margin-bottom:3px}
.heading-title-line{display:flex;align-items:center;gap:11px}
.content-heading h2{font-size:23px;font-weight:770;letter-spacing:-.25px;margin:0}
.heading-counter{font-size:11px;padding:4px 10px;border-radius:9px;background:#f1f4f7;color:#7b8796;font-weight:700}
.content-heading p{color:#9aa3af;font-size:12px;margin:6px 0 0}
.text-button{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:720;white-space:nowrap;padding:9px 0}
.text-button:hover{text-decoration:underline}
.text-button:disabled{color:#a6afbb;text-decoration:none;cursor:default}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.search-wrap{position:relative;flex:1;max-width:440px}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;color:#97a3af}
.search-wrap input{width:100%;height:43px;padding:0 44px 0 40px;border:1px solid #e3e8ee;background:#fafbfc;border-radius:10px;color:var(--ink);outline:0;transition:border-color .15s,background .15s}
.search-wrap input:focus{border-color:#7dc0b1;background:#fff;box-shadow:0 0 0 3px #def2ed}
.search-wrap input::placeholder{color:#a7b0bc}
.search-wrap kbd{position:absolute;right:12px;top:11px;background:#fff;border:1px solid #e4e8ee;border-radius:5px;color:#b1b9c4;font-size:11px;line-height:18px;width:18px;height:20px;text-align:center;font-family:inherit}
.filter-group{display:flex;align-items:center;gap:3px;padding:3px;background:#f4f6f8;border:1px solid #eef1f4;border-radius:10px;flex-shrink:0}
.filter-btn{border:0;background:transparent;color:#8792a2;font-size:12px;font-weight:630;padding:8px 13px;border-radius:7px;white-space:nowrap}
.filter-btn:hover{color:#4b5d70}
.filter-btn.active{background:white;color:#245548;box-shadow:0 1px 5px rgba(40,60,70,.09)}
.list-meta{display:flex;justify-content:space-between;gap:12px;align-items:center;font-size:11px;color:#a0a9b4;margin-bottom:9px;padding:0 2px}
.meta-hint{color:#b4bdc8}
.student-list{display:flex;flex-direction:column;gap:7px}
.list-section-label{margin:17px 1px 8px;color:#718093;font-weight:750;font-size:12px;display:flex;align-items:center;gap:10px}
.list-section-label:first-child{margin-top:3px}
.list-section-label::after{content:"";height:1px;flex:1;background:#ecf0f3}
.student-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:66px;border:1px solid #e9edf2;background:#fff;border-radius:11px;padding:0 16px 0 14px;transition:background .15s,border-color .15s,transform .15s}
.student-row:hover{background:#fafdfc;border-color:#d0e3db}
.student-row.found{background:#f8faf9;border-color:#e7eeeb}
.student-label{display:flex;align-items:center;gap:16px;flex:1;cursor:pointer;padding:13px 0;min-width:0}
.student-check{appearance:none;flex:none;width:23px;height:23px;border:1.6px solid #cbd3da;border-radius:7px;background:#fff;margin:0;display:grid;place-content:center;cursor:pointer;transition:background .15s,border-color .15s}
.student-check::before{content:"";width:10px;height:6px;border-left:2px solid white;border-bottom:2px solid white;transform:translateY(-2px) rotate(-45deg) scale(0);transition:transform .12s}
.student-check:checked{background:var(--accent);border-color:var(--accent)}
.student-check:checked::before{transform:translateY(-2px) rotate(-45deg) scale(1)}
.student-name{font-size:16px;font-weight:710;letter-spacing:.5px;color:#2c3948;white-space:nowrap}
.found .student-name{color:#9ca9a4;text-decoration:line-through;text-decoration-color:#b6c2bd}
.initial-badge{display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#6e8195;background:#f1f4f8;border-radius:7px;width:27px;height:27px;flex:none}
.found .initial-badge{background:#eef3f0;color:#9aa7a1}
.row-right{display:flex;align-items:center;gap:12px;flex:none}
.row-status{font-size:11px;color:#acb5c0}
.found .row-status{color:#78a995}
.row-class{font-size:11px;color:#9da9b5;padding:4px 8px;background:#f5f7f9;border-radius:6px}
.empty-state{text-align:center;padding:65px 20px 75px;color:#9ba7b4}
.empty-state[hidden]{display:none}
.empty-illustration{width:66px;height:66px;margin:0 auto 16px;background:#e8f7f1;border-radius:20px;display:grid;place-items:center;color:#20a084;font-size:32px;font-weight:700}
.empty-state h3{color:#445567;font-size:16px;margin:0 0 6px}
.empty-state p{font-size:12px;margin:0 auto 20px;max-width:330px}
.content-footer{display:flex;align-items:center;justify-content:space-between;gap:15px;border-top:1px solid #edf0f3;margin-top:28px;padding-top:16px;color:#acb5c0;font-size:11px}
.danger-link{border:0;background:transparent;color:#b6a2a0;font-size:11px;white-space:nowrap}
.danger-link:hover{color:#cb615f;text-decoration:underline}
.page-footer{display:flex;justify-content:space-between;gap:16px;color:#b0b8c2;font-size:11px;padding:20px 5px 5px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);border:1px solid #3f5262;border-radius:12px;background:#293b4d;color:#fff;box-shadow:0 13px 35px rgba(31,43,57,.22);padding:12px 16px;display:flex;align-items:center;gap:20px;font-size:13px;z-index:20;max-width:calc(100vw - 24px)}
.toast[hidden]{display:none}
.toast button{border:0;background:transparent;color:#8de2c7;font-weight:740;white-space:nowrap}
@media(max-width:1060px){.app-shell{padding:25px 23px}.summary{grid-template-columns:1.3fr 1fr 1fr}.metric-card{padding:18px;gap:12px}.workspace{grid-template-columns:245px minmax(0,1fr)}.content-panel{padding:24px}.header-actions{gap:7px}.autosave{display:none}}
@media(max-width:760px){.app-shell{padding:17px 14px}.app-header{align-items:flex-start;flex-direction:column;gap:18px;margin-bottom:20px}.header-actions{width:100%}.header-actions .button{flex:1}.brand-mark{width:47px;height:47px}.eyebrow{font-size:9px;letter-spacing:1.3px}h1{font-size:21px}.summary{grid-template-columns:1fr 1fr;gap:9px}.overview-card{grid-column:1/-1;min-height:0;padding:18px 20px}.metric-card{min-height:125px;padding:15px;gap:10px}.metric-icon{width:36px;height:36px;border-radius:11px;font-size:21px}.metric-value{font-size:29px}.metric-card p{white-space:normal}.workspace{display:block}.class-panel{position:static;padding:15px 12px;margin-bottom:12px}.panel-heading{padding:0 5px 10px}.class-nav{display:flex;flex-direction:row;overflow-x:auto;gap:7px;padding-bottom:3px;scrollbar-width:thin}.class-button{width:auto;min-width:98px;flex:none;padding:9px 10px;gap:6px}.class-button.all{margin:0;min-width:104px;border-bottom:1px solid transparent}.class-mini-track{height:3px}.panel-tip{display:none}.content-panel{padding:20px 15px;min-height:450px}.content-heading{margin-bottom:17px}.content-heading h2{font-size:20px}.toolbar{align-items:stretch;flex-direction:column}.search-wrap{max-width:unset}.filter-group{width:100%;justify-content:space-between}.filter-btn{flex:1}.student-row{min-height:62px}.content-footer{align-items:flex-start;line-height:1.7}.page-footer{flex-direction:column;gap:3px}.row-right{gap:5px}.row-status{display:none}}
@media(max-width:370px){.header-actions .button{font-size:12px;padding:9px}.metric-card p{display:none}.student-name{font-size:15px}.student-label{gap:10px}.content-footer span{max-width:190px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16v4a2.5 2.5 0 0 0 0 5v4H4v-4a2.5 2.5 0 0 0 0-5z"/><path d="M12 5.5v2.2m0 3v2.6m0 3v2.2" stroke-dasharray="2 2"/></svg>
        </div>
        <div>
          <p class="eyebrow">2026 全国大学生数学竞赛 · 离线版</p>
          <h1>准考证分班核对</h1>
        </div>
      </div>
      <div class="header-actions">
        <span class="autosave" id="saveIndicator"><span class="save-dot"></span>已在本机保存</span>
        <button class="button button-outline" id="importButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3m0 13-4-4m4 4 4-4M4 16v4h16v-4"/></svg>
          导入记录
        </button>
        <button class="button button-dark" id="exportButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v13m0 0-4-4m4 4 4-4M4 16v4h16v-4"/></svg>
          导出记录
        </button>
        <input type="file" id="importFile" accept=".csv,text/csv" hidden>
      </div>
    </header>

    <section class="summary" aria-label="总核对进度">
      <div class="overview-card">
        <div class="overview-topline"><span class="overview-label">整体核对进度</span><span id="overallPercent" class="overview-percent">0%</span></div>
        <div class="overview-main"><strong id="totalDone">0</strong><span class="overview-denominator">/ <span id="totalCount">0</span> 人</span></div>
        <div class="progress-track"><div id="overallBar" class="progress-fill"></div></div>
        <p class="card-footnote">勾选即表示已找到对应准考证</p>
      </div>
      <div class="metric-card">
        <div class="metric-icon pending-icon" aria-hidden="true">○</div>
        <div><span class="metric-label">尚未找到</span><div class="metric-value" id="totalPending">0</div><p>优先核对这些同学</p></div>
      </div>
      <div class="metric-card">
        <div class="metric-icon done-icon" aria-hidden="true">✓</div>
        <div><span class="metric-label">已找到</span><div class="metric-value" id="totalFound">0</div><p>可随时取消勾选</p></div>
      </div>
    </section>

    <div class="workspace">
      <aside class="class-panel" aria-label="按小班切换">
        <div class="panel-heading"><h2>按小班核对</h2><span class="class-count" id="classCount"></span></div>
        <nav id="classNav" class="class-nav" aria-label="班级列表"></nav>
        <div class="panel-tip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a7 7 0 0 0-4 12.75V19h8v-3.25A7 7 0 0 0 12 3zM9 22h6M9 17h6"/></svg>
          <span>进度自动保存在当前浏览器。换设备前请先导出记录。</span>
        </div>
      </aside>

      <main class="content-panel">
        <div class="content-heading">
          <div>
            <div class="heading-kicker" id="viewKicker">当前班级</div>
            <div class="heading-title-line"><h2 id="viewTitle">加载中…</h2><span class="heading-counter" id="viewCounter"></span></div>
            <p id="viewSubtitle">点击姓名左侧的方框，标记为已找到</p>
          </div>
          <button class="text-button" id="nextClassButton" type="button">下一个小班 <span aria-hidden="true">→</span></button>
        </div>

        <div class="toolbar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg>
            <input id="searchInput" type="search" autocomplete="off" placeholder="搜索姓名或首字母（跨班级）" aria-label="搜索姓名或首字母">
            <kbd>/</kbd>
          </div>
          <div class="filter-group" role="group" aria-label="核对状态筛选">
            <button data-filter="pending" type="button" class="filter-btn active" aria-pressed="true">未找到</button>
            <button data-filter="all" type="button" class="filter-btn" aria-pressed="false">全部</button>
            <button data-filter="found" type="button" class="filter-btn" aria-pressed="false">已找到</button>
          </div>
        </div>

        <div class="list-meta"><span id="listMeta">正在读取名单…</span><span class="meta-hint">点击整行即可勾选</span></div>
        <div id="studentList" class="student-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div class="empty-illustration" aria-hidden="true">✓</div>
          <h3 id="emptyTitle">没有待核对的同学</h3>
          <p id="emptyText"></p>
          <button class="button button-outline" id="emptyAction" type="button">查看全部</button>
        </div>
        <div class="content-footer">
          <span>名单按照姓名首字母排列，重复核对时可切换“全部”。</span>
          <button id="resetClassButton" type="button" class="danger-link">清除本班勾选</button>
        </div>
      </main>
    </div>
    <footer class="page-footer"><span>仅用于准考证分发核对</span><span>完全离线运行 · 进度请定期导出备份</span></footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden><span id="toastMessage"></span><button id="undoButton" type="button">撤销</button></div>
  <script>
window.STUDENTS = [{"id":"252111|兰皓森","group":"252111","name":"兰皓森","initial":"L"},{"id":"252111|李斌","group":"252111","name":"李斌","initial":"L"},{"id":"252111|李承臻","group":"252111","name":"李承臻","initial":"L"},{"id":"252111|刘佳睿","group":"252111","name":"刘佳睿","initial":"L"},{"id":"252111|刘语琪","group":"252111","name":"刘语琪","initial":"L"},{"id":"252111|吕逢恩","group":"252111","name":"吕逢恩","initial":"L"},{"id":"252111|彭建宇","group":"252111","name":"彭建宇","initial":"P"},{"id":"252111|唐梓媛","group":"252111","name":"唐梓媛","initial":"T"},{"id":"252111|王绍辰","group":"252111","name":"王绍辰","initial":"W"},{"id":"252111|王志杰","group":"252111","name":"王志杰","initial":"W"},{"id":"252111|奚一丹","group":"252111","name":"奚一丹","initial":"X"},{"id":"252111|鄢定琪","group":"252111","name":"鄢定琪","initial":"Y"},{"id":"252111|赵欣宇","group":"252111","name":"赵欣宇","initial":"Z"},{"id":"252112|贾远东","group":"252112","name":"贾远东","initial":"J"},{"id":"252112|李奕霄","group":"252112","name":"李奕霄","initial":"L"},{"id":"252112|梁骆豪","group":"252112","name":"梁骆豪","initial":"L"},{"id":"252112|林子涵","group":"252112","name":"林子涵","initial":"L"},{"id":"252112|吕学珲","group":"252112","name":"吕学珲","initial":"L"},{"id":"252112|马子钰","group":"252112","name":"马子钰","initial":"M"},{"id":"252112|钱一睿","group":"252112","name":"钱一睿","initial":"Q"},{"id":"252112|任星宇","group":"252112","name":"任星宇","initial":"R"},{"id":"252112|史根豪","group":"252112","name":"史根豪","initial":"S"},{"id":"252112|王玺润","group":"252112","name":"王玺润","initial":"W"},{"id":"252112|王子轩","group":"252112","name":"王子轩","initial":"W"},{"id":"252112|文嘉铭","group":"252112","name":"文嘉铭","initial":"W"},{"id":"252112|谢昊桦","group":"252112","name":"谢昊桦","initial":"X"},{"id":"252112|徐铄壹","group":"252112","name":"徐铄壹","initial":"X"},{"id":"252112|徐业建","group":"252112","name":"徐业建","initial":"X"},{"id":"252112|杨子墨","group":"252112","name":"杨子墨","initial":"Y"},{"id":"252112|叶铭轩","group":"252112","name":"叶铭轩","initial":"Y"},{"id":"252112|赵崇含","group":"252112","name":"赵崇含","initial":"Z"},{"id":"252112|智琳雅","group":"252112","name":"智琳雅","initial":"Z"},{"id":"252113|刘宇航","group":"252113","name":"刘宇航","initial":"L"},{"id":"252113|刘语茗","group":"252113","name":"刘语茗","initial":"L"},{"id":"252113|宋浩然","group":"252113","name":"宋浩然","initial":"S"},{"id":"252113|王丙文","group":"252113","name":"王丙文","initial":"W"},{"id":"252113|薛智璇","group":"252113","name":"薛智璇","initial":"X"},{"id":"252113|杨皓然","group":"252113","name":"杨皓然","initial":"Y"},{"id":"252113|于政博","group":"252113","name":"于政博","initial":"Y"},{"id":"252113|张宏远","group":"252113","name":"张宏远","initial":"Z"},{"id":"252113|郑翔泽","group":"252113","name":"郑翔泽","initial":"Z"},{"id":"252113|朱竹川","group":"252113","name":"朱竹川","initial":"Z"},{"id":"252113|杨玄铃","group":"252113","name":"杨玄铃","initial":"Y"},{"id":"252114|丁小洋","group":"252114","name":"丁小洋","initial":"D"},{"id":"252114|付恒","group":"252114","name":"付恒","initial":"F"},{"id":"252114|贺俊涵","group":"252114","name":"贺俊涵","initial":"H"},{"id":"252114|江怡然","group":"252114","name":"江怡然","initial":"J"},{"id":"252114|李昀睿","group":"252114","name":"李昀睿","initial":"L"},{"id":"252114|李琢言","group":"252114","name":"李琢言","initial":"L"},{"id":"252114|陆勃瑀","group":"252114","name":"陆勃瑀","initial":"L"},{"id":"252114|秦健皓","group":"252114","name":"秦健皓","initial":"Q"},{"id":"252114|宋知航","group":"252114","name":"宋知航","initial":"S"},{"id":"252114|王海愈","group":"252114","name":"王海愈","initial":"W"},{"id":"252114|于舜同","group":"252114","name":"于舜同","initial":"Y"},{"id":"252114|周轩圻","group":"252114","name":"周轩圻","initial":"Z"},{"id":"252114|朱婷","group":"252114","name":"朱婷","initial":"Z"},{"id":"252115|陈翀","group":"252115","name":"陈翀","initial":"C"},{"id":"252115|陈雨萱","group":"252115","name":"陈雨萱","initial":"C"},{"id":"252115|樊佳杰","group":"252115","name":"樊佳杰","initial":"F"},{"id":"252115|付仪文","group":"252115","name":"付仪文","initial":"F"},{"id":"252115|贺子俊","group":"252115","name":"贺子俊","initial":"H"},{"id":"252115|赫婉晴","group":"252115","name":"赫婉晴","initial":"H"},{"id":"252115|黄文烽","group":"252115","name":"黄文烽","initial":"H"},{"id":"252115|李宛聪","group":"252115","name":"李宛聪","initial":"L"},{"id":"252115|乔韵琪","group":"252115","name":"乔韵琪","initial":"Q"},{"id":"252115|王恩宇","group":"252115","name":"王恩宇","initial":"W"},{"id":"252115|尹则淏","group":"252115","name":"尹则淏","initial":"Y"},{"id":"257112|胡钱钱","group":"257112","name":"胡钱钱","initial":"H"},{"id":"257115|刘凯南","group":"257115","name":"刘凯南","initial":"L"},{"id":"257115|王嘉楷","group":"257115","name":"王嘉楷","initial":"W"}];
</script>
  <script>
(() => {
  'use strict';

  // Keep the original record IDs and class codes, so previous checkmarks and
  // exported CSV backups still match after displaying merged classes.
  const displayGroup = group => ({'257112':'252111','257115':'252115'})[group] || group;
  const pinyin = new Intl.Collator('zh-CN-u-co-pinyin');
  const students = (Array.isArray(window.STUDENTS) ? window.STUDENTS : []).slice()
    .sort((a, b) => displayGroup(a.group).localeCompare(displayGroup(b.group), 'zh-CN') || pinyin.compare(a.name, b.name));
  const groups = [...new Set(students.map(s => displayGroup(s.group)))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
  const byId = new Map(students.map(s => [s.id, s]));
  const storageKey = 'math-contest-ticket-check-2026-v1';
  const $ = id => document.getElementById(id);
  const escapeHtml = text => String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

  let state = {found: {}, group: groups[0] || 'all'};
  let filter = 'pending';
  let storageWorking = true;
  let undoChange = null;
  let toastTimeout = null;

  try {
    const saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
    if (saved && typeof saved === 'object') {
      if (saved.found && typeof saved.found === 'object') {
        state.found = Object.fromEntries(Object.entries(saved.found).filter(([id]) => byId.has(id)));
      }
      if (saved.group === 'all' || groups.includes(displayGroup(saved.group))) state.group = displayGroup(saved.group);
    }
  } catch (_) { storageWorking = false; }

  const found = student => Boolean(state.found[student.id]);
  const countFound = list => list.reduce((count, student) => count + Number(found(student)), 0);
  const percent = (part, whole) => whole ? Math.round(part / whole * 100) : 0;

  function persist() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(state));
      storageWorking = true;
    } catch (_) { storageWorking = false; }
    $('saveIndicator').classList.toggle('warning', !storageWorking);
    $('saveIndicator').innerHTML = storageWorking
      ? '<span class="save-dot"></span>已在本机保存'
      : '<span class="save-dot"></span>无法自动保存，请导出记录';
  }

  function setGroup(group) {
    if (group !== 'all' && !groups.includes(group)) return;
    state.group = group;
    $('searchInput').value = '';
    persist();
    render();
  }

  function setFilter(next) {
    filter = next;
    document.querySelectorAll('[data-filter]').forEach(button => {
      const active = button.dataset.filter === filter;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    render();
  }

  function renderNav() {
    const total = students.length;
    const totalChecked = countFound(students);
    const rows = [{id:'all', name:'全部班级', rows:students, note:'查看完整名单'}, ...groups.map(group => ({id:group, name:group, rows:students.filter(s => displayGroup(s.group) === group)}))];
    $('classCount').textContent = `${groups.length} 个班`;
    $('classNav').innerHTML = rows.map(item => {
      const done = item.id === 'all' ? totalChecked : countFound(item.rows);
      const active = item.id === state.group;
      const className = item.id === 'all' ? 'class-button all' : 'class-button';
      return `<button type="button" class="${className}${active ? ' active' : ''}" data-group="${escapeHtml(item.id)}" aria-current="${active ? 'true' : 'false'}">
        <span class="class-top"><span class="class-name">${escapeHtml(item.name)}</span><span class="class-progress-text">${done}/${item.rows.length}</span></span>
        <span class="class-mini-track"><span class="class-mini-fill" style="display:block;width:${percent(done,item.rows.length)}%"></span></span>
        ${item.note ? `<span class="all-note">${item.note}</span>` : ''}
      </button>`;
    }).join('');
  }

  function renderRow(student, showGroup) {
    const checked = found(student);
    return `<label class="student-row${checked ? ' found' : ''}">
      <span class="student-label">
        <input class="student-check" type="checkbox" data-id="${escapeHtml(student.id)}" ${checked ? 'checked' : ''} aria-label="${escapeHtml(student.name)} 已找到准考证">
        <span class="initial-badge" aria-hidden="true">${escapeHtml(student.initial)}</span>
        <span class="student-name">${escapeHtml(student.name)}</span>
      </span>
      <span class="row-right"><span class="row-status">${checked ? '已找到' : '待核对'}</span>${student.group !== displayGroup(student.group) ? `<span class="row-class" title="原报名班号">原 ${escapeHtml(student.group)}</span>` : showGroup ? `<span class="row-class">${escapeHtml(student.group)}</span>` : ''}</span>
    </label>`;
  }

  function render() {
    const totalDone = countFound(students);
    $('totalDone').textContent = totalDone;
    $('totalCount').textContent = students.length;
    $('totalPending').textContent = students.length - totalDone;
    $('totalFound').textContent = totalDone;
    $('overallPercent').textContent = `${percent(totalDone, students.length)}%`;
    $('overallBar').style.width = `${percent(totalDone, students.length)}%`;
    renderNav();

    const query = $('searchInput').value.trim().toLocaleUpperCase();
    const searchMode = Boolean(query);
    const scoped = searchMode || state.group === 'all' ? students : students.filter(s => displayGroup(s.group) === state.group);
    const matched = scoped.filter(s => !query || s.name.includes(query) || s.initial.includes(query));
    const visible = matched.filter(s => filter === 'all' || (filter === 'found' ? found(s) : !found(s)));
    const scopedDone = countFound(matched);

    $('viewKicker').textContent = searchMode ? '跨班级搜索' : state.group === 'all' ? '所有报名同学' : '当前小班';
    $('viewTitle').textContent = searchMode ? '搜索结果' : state.group === 'all' ? '全部班级' : `${state.group} 班`;
    $('viewCounter').textContent = `${scopedDone} / ${matched.length} 已找到`;
    $('viewSubtitle').textContent = searchMode ? '搜索范围包含全部小班' : state.group === '252111' ? '已包含原 257112 班的 1 人' : state.group === '252115' ? '已包含原 257115 班的 2 人' : '每找到一张准考证，就点击对应姓名勾选';
    $('listMeta').textContent = `显示 ${visible.length} 人${filter === 'pending' ? ' · 尚未找到' : filter === 'found' ? ' · 已找到' : ''}`;

    const groupHeadings = searchMode || state.group === 'all';
    if (groupHeadings) {
      const visibleGroups = [...new Set(visible.map(s => displayGroup(s.group)))];
      $('studentList').innerHTML = visibleGroups.map(group => {
        const rows = visible.filter(s => displayGroup(s.group) === group);
        return `<div class="list-section-label">${escapeHtml(group)} 班 · ${rows.length} 人</div>${rows.map(s => renderRow(s, false)).join('')}`;
      }).join('');
    } else {
      $('studentList').innerHTML = visible.map(s => renderRow(s, false)).join('');
    }

    const empty = visible.length === 0;
    $('emptyState').hidden = !empty;
    if (empty) {
      $('emptyTitle').textContent = searchMode && matched.length === 0 ? '没有匹配的同学' : filter === 'pending' ? '这部分已经核对完了' : filter === 'found' ? '还没有已找到的同学' : '暂无记录';
      $('emptyText').textContent = searchMode && matched.length === 0 ? '可以换个姓名或首字母再试试。' : filter === 'pending' ? '可以切换下一个小班，或点击“全部”复查已经勾选的名单。' : '切换筛选条件查看其他同学。';
      $('emptyAction').textContent = searchMode && matched.length === 0 ? '清除搜索' : '查看全部';
    }

    const currentIndex = groups.indexOf(state.group);
    $('nextClassButton').textContent = currentIndex === groups.length - 1 ? '回到第一个小班 →' : '下一个小班 →';
    $('nextClassButton').hidden = groups.length < 2;
    $('resetClassButton').disabled = state.group === 'all';
    $('resetClassButton').style.visibility = state.group === 'all' ? 'hidden' : 'visible';
  }

  function showToast(message, action = true) {
    clearTimeout(toastTimeout);
    $('toastMessage').textContent = message;
    $('undoButton').hidden = !action;
    $('toast').hidden = false;
    toastTimeout = setTimeout(() => { $('toast').hidden = true; undoChange = null; }, 6500);
  }

  function toggleStudent(id, isFound) {
    const student = byId.get(id);
    if (!student) return;
    const previous = state.found[id] || null;
    if (isFound) state.found[id] = new Date().toISOString();
    else delete state.found[id];
    undoChange = {id, previous};
    persist();
    render();
    showToast(`${student.name}${isFound ? '：已找到' : '：已取消勾选'}`);
  }

  function csvField(value) {
    const text = String(value ?? '');
    return `"${text.replace(/"/g, '""')}"`;
  }

  function downloadCsv() {
    const headers = ['小班','姓名','姓名首字母','核对状态','核对时间'];
    const records = students.map(s => [s.group,s.name,s.initial,found(s) ? '已找到' : '未找到',state.found[s.id] || '']);
    const csv = '\ufeff' + [headers,...records].map(row => row.map(csvField).join(',')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8;'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = `准考证核对记录_${new Date().toLocaleDateString('en-CA')}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('核对记录已导出，可用 Excel 打开或下次导入', false);
  }

  function parseCsv(text) {
    const rows = [];
    let row = [], current = '', quoted = false;
    const input = text.replace(/^\ufeff/, '');
    for (let i = 0; i < input.length; i++) {
      const char = input[i];
      if (quoted) {
        if (char === '"' && input[i + 1] === '"') { current += '"'; i++; }
        else if (char === '"') quoted = false;
        else current += char;
      } else if (char === '"') quoted = true;
      else if (char === ',') { row.push(current); current = ''; }
      else if (char === '\n') { row.push(current.replace(/\r$/, '')); if (row.some(Boolean)) rows.push(row); row = []; current = ''; }
      else current += char;
    }
    if (quoted) throw new Error('CSV 引号未闭合');
    if (row.length || current) { row.push(current.replace(/\r$/, '')); rows.push(row); }
    return rows;
  }

  async function importCsv(file) {
    try {
      const rows = parseCsv(await file.text());
      const expected = ['小班','姓名','姓名首字母','核对状态','核对时间'];
      if (!rows.length || expected.some((header, index) => rows[0][index] !== header)) throw new Error('不是本网页导出的核对表');
      const incoming = new Map();
      for (const columns of rows.slice(1)) {
        const id = `${columns[0]}|${columns[1]}`;
        if (!byId.has(id) || incoming.has(id) || !['已找到','未找到'].includes(columns[3])) throw new Error('名单或核对状态与当前页面不匹配');
        incoming.set(id, columns);
      }
      // Old exports contain 68 rows. They can be restored as long as the only
      // missing records are the two later additions to class 252113.
      const newIds = new Set(['252113|朱竹川','252113|杨玄铃']);
      const missing = students.filter(s => !incoming.has(s.id));
      if (missing.some(s => !newIds.has(s.id))) throw new Error(`记录数或名单不符：缺少 ${missing.length} 人`);
      const done = [...incoming.values()].filter(columns => columns[3] === '已找到').length;
      const difference = missing.length ? `（另有 ${missing.length} 位新增同学将保持未找到）` : '';
      if (!window.confirm(`识别到 ${incoming.size} 人，其中 ${done} 人已找到${difference}。要用这份记录覆盖当前浏览器的勾选状态吗？`)) return;
      const next = {};
      for (const [id, columns] of incoming) if (columns[3] === '已找到') next[id] = columns[4] || new Date().toISOString();
      state.found = next;
      undoChange = null;
      persist();
      render();
      showToast(`已恢复记录：${done} 人已找到`, false);
    } catch (error) {
      window.alert(`导入失败：${error.message}`);
    }
  }

  $('classNav').addEventListener('click', event => {
    const button = event.target.closest('[data-group]');
    if (button) setGroup(button.dataset.group);
  });
  $('studentList').addEventListener('change', event => {
    if (event.target.matches('.student-check')) toggleStudent(event.target.dataset.id, event.target.checked);
  });
  $('searchInput').addEventListener('input', render);
  document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => setFilter(button.dataset.filter)));
  $('nextClassButton').addEventListener('click', () => {
    const currentIndex = groups.indexOf(state.group);
    setGroup(groups[(currentIndex + 1) % groups.length]);
  });
  $('resetClassButton').addEventListener('click', () => {
    const group = state.group;
    if (group === 'all') return;
    const affected = students.filter(s => displayGroup(s.group) === group && found(s));
    if (!affected.length) return showToast('本班目前没有已勾选的同学', false);
    if (!window.confirm(`确定清除 ${group} 班 ${affected.length} 人的勾选记录吗？此操作无法撤销。`)) return;
    affected.forEach(s => delete state.found[s.id]);
    undoChange = null;
    persist();
    render();
    showToast(`已清除 ${group} 班的勾选`, false);
  });
  $('emptyAction').addEventListener('click', () => {
    if ($('searchInput').value.trim() && !students.some(s => s.name.includes($('searchInput').value.trim()) || s.initial.includes($('searchInput').value.trim().toUpperCase()))) {
      $('searchInput').value = '';
      render();
      $('searchInput').focus();
    } else setFilter('all');
  });
  $('undoButton').addEventListener('click', () => {
    if (!undoChange) return;
    if (undoChange.previous) state.found[undoChange.id] = undoChange.previous;
    else delete state.found[undoChange.id];
    undoChange = null;
    persist();
    render();
    $('toast').hidden = true;
  });
  $('exportButton').addEventListener('click', downloadCsv);
  $('importButton').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (file) await importCsv(file);
    event.target.value = '';
  });
  document.addEventListener('keydown', event => {
    const typing = ['INPUT','TEXTAREA'].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;
    if (event.key === '/' && !typing && !event.ctrlKey && !event.metaKey) {
      event.preventDefault();
      $('searchInput').focus();
    }
    if (event.key === 'Escape' && document.activeElement === $('searchInput')) {
      $('searchInput').value = '';
      $('searchInput').blur();
      render();
    }
  });
  persist();
  render();
})();

</script>
